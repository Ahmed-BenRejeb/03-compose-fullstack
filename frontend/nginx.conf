server {
    listen 80;

    # Docker's internal DNS server: lets nginx find "backend" again
    # every few seconds (useful when you scale it to several containers)
    resolver 127.0.0.11 valid=5s;

    # Serve the static frontend
    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    # Forward API calls to the backend container (service name "backend")
    location /api/ {
        set $backend http://backend:5000;
        proxy_pass $backend;
    }
}
